# LGDSRFPA × Gemma-4-E4B-it — replaces Gemma-3-TAIDE-12B (proposal) with Gemma 4 E4B.
# Mapping to the proposal / ED (experiment design.pdf, Ch.4):
#   "第 48 層 Gated FFN"  → last decoder layer (index 41 of 42), Gemma4TextMLP
#   d_model 3840 / p 15360 → 2560 / 10240
#   D* = 20 × N_trainable  (same rule as 12B track: 20 × 177M = 3.54B)
#        N_trainable = 3 × 2560 × 10240 = 78.64M  →  D* = 1.573B tokens

run:
  seed: 42
  out_root: /home/renhe/gemma4_pretrain/runs           # runs/<experiment>/
  track: gx10                                          # ED §4.3: gx10 | aistack

model:
  hf_repo: google/gemma-4-E4B-it
  local_path: /home/renhe/gemma4_pretrain/models/gemma-4-E4B-it
  trainable_layer_index: -1                            # last layer (index 41)
  dtype: bfloat16

data:
  dfin_dir: /home/renhe/gemma4_pretrain/data/dfin      # build_dfin.py output
  seq_len: 4096
  n_val_seqs: 128                                      # fixed L_val set (≈0.5M tok)
  n_ref_seqs: 64                                       # learning-goal reference set R (disjoint from L_val set)

budget:
  d_star_tokens: 1_573_000_000                         # 20 × 78.64M
  dose_checkpoints: [0.25, 0.50, 0.75, 1.00]           # ED §4.4 cumulative corpus-dose

weight_tuning:                                         # Eq. 11–12; ED §4.2: L_CLM is the objective
  lr: 2.0e-5
  min_lr: 1.0e-6
  warmup_steps: 100
  betas: [0.9, 0.95]
  grad_clip: 1.0
  micro_batch: 4
  grad_accum: 16                                       # 64 seq × 4096 = 262,144 tok / step

learning_goal:                                         # Eq. 10: ‖z_c − z*_c‖ ≤ ε  (relative to ‖z*_c‖)
  epsilon: 0.02                                        # set by pilot screening (ED §4.7), see docs
  reference: base-mlp                                  # z*_c = F_L(x_c; w_0): exact, prefix frozen

control:
  control_interval: 25                                 # opt-steps between learning-goal checks / module dispatch
  eval_interval: 100                                   # opt-steps between L_val evals
  save_every: 100

structuring:                                           # Algo 1–4
  isolating_max_tries: 32                              # T
  max_adds_per_round: 8
  residual_target: 0.5                                 # Node-Adding repairs κ to ≤ 0.5·ε

network_tuning:                                        # Algo 4(WR)/5/6, ED §4.8
  F_max: 5
  prune_block: 32                                      # channels per pruning candidate
  max_accepts_per_round: 4
  lambda_init: 1.0e-6                                  # λ‖w‖²: ‖w‖² of the MLP ≈ 1e4 → λ·‖w‖² ≈ 1e-2 at init
  lambda_min: 1.0e-8
  lambda_max: 1.0e-4
  eta_up: 1.05                                         # η ∈ [1.02, 1.10]
  gamma_down: 0.70                                     # γ ∈ [0.50, 0.90]
  val_tolerance: 0.002                                 # "L_val 未惡化超過容許範圍"

plateau:                                               # ED §4.5
  delta_threshold: 1.0e-3
  consecutive_evals: 3

safety:                                                # ED §4.7 — not a primary stop
  divergence_factor: 5.0
  struct_fail_streak: 20
